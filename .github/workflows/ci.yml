name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/MiniEcommerce.slnx

      - name: Build
        run: dotnet build backend/MiniEcommerce.slnx --no-restore --configuration Release

      - name: Test (fast suite — skips Integration-DB per tasks/test-spec.md §6)
        run: dotnet test backend/MiniEcommerce.slnx --no-build --no-restore --configuration Release --logger "console;verbosity=normal" --filter "Category!=Integration-DB"

  backend-integration-db:
    name: Backend (Integration-DB — Postgres via Testcontainers)
    runs-on: ubuntu-latest
    # Opt-in only — schedule + manual dispatch. Pulls postgres:16-alpine
    # (~5 s startup) and runs the Trait("Category", "Integration-DB") tests
    # in backend/MiniEcommerce.Api.Tests/Integration/Postgres/*. Per
    # tasks/test-spec.md §6 the fast suite is the default; this job exists
    # to validate the Testcontainers harness without slowing every push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/MiniEcommerce.slnx

      - name: Build
        run: dotnet build backend/MiniEcommerce.slnx --no-restore --configuration Release

      - name: Test (Integration-DB only)
        run: dotnet test backend/MiniEcommerce.Api.Tests/MiniEcommerce.Api.Tests.csproj --no-build --no-restore --configuration Release --logger "console;verbosity=normal" --filter "Category=Integration-DB"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm run test:run
